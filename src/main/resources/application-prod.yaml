spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tatakae_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Hard lock: neither the console nor the raw specification are reachable outside development.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  avatar:
    storage-dir: ${AVATAR_STORAGE_DIR:/data/avatars}
    public-base-url: ${AVATAR_PUBLIC_BASE_URL:https://api.tatakae.fit}
    max-bytes: ${AVATAR_MAX_BYTES:2097152}
