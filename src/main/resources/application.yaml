spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  application:
    name: tatakae-api
  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

app:
  avatar:
    storage-dir: ${AVATAR_STORAGE_DIR:./data/avatars}
    public-base-url: ${AVATAR_PUBLIC_BASE_URL:http://localhost:8080}
    max-bytes: ${AVATAR_MAX_BYTES:2097152}
  apple:
    # Comma-separated list of Apple client IDs (iOS Bundle ID and Web Services ID)
    # Example: com.tatakae.ios,fit.tatakae.web
    client-ids: ${APPLE_CLIENT_IDS:com.example.tatakae,fit.tatakae.web}
    # Apple's public JWKS endpoint for token validation
    jwks-url: ${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}
  cors:
    # Comma-separated list of allowed origins for CORS
    # Includes local development origins by default
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Only the health probe is reachable over HTTP, mapped to /healthcheck.
# It reports DOWN when a required dependency such as PostgreSQL is unreachable,
# so it is a real liveness signal and not a hardcoded "UP".
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: healthcheck
  endpoint:
    health:
      show-details: never

# Documentation is off unless a profile turns it on: production must not expose the contract.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
