name: tatakae-api-production

services:
  # PostgreSQL database - internal network only, never exposed to host
  db:
    image: postgres:16-alpine
    container_name: tatakae-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # IMPORTANT: No ports mapping - Postgres stays on the internal Docker network only

  # Spring Boot API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tatakae-api-prod
    restart: unless-stopped
    environment:
      # Database connection (internal Docker network)
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod
      # Apple authentication
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS}
      APPLE_JWKS_URL: ${APPLE_JWKS_URL:-https://appleid.apple.com/auth/keys}
      # CORS configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Caddy reverse proxy with automatic HTTPS/TLS
  caddy:
    image: caddy:2-alpine
    container_name: tatakae-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - api

networks:
  # Internal network - Postgres only accessible by API
  internal:
    driver: bridge
  # Web network - API and Caddy
  web:
    driver: bridge

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
