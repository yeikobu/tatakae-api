services:
  db:
    image: postgres:16-alpine
    container_name: tatakae-postgres-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-tatakae_db}
      POSTGRES_USER: ${DB_USER:-tatakae_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tatakae_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tatakae_user} -d ${DB_NAME:-tatakae_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
